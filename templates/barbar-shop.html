<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Cuts - Barber Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>💈 Classic Cuts</h1>
            <p>Where style meets tradition. Book your slot below.</p>
        </header>

        <div class="card">
            <h2>Book an Appointment</h2>
            <form action="/book" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g. 555-1234" required>
                </div>

                <div class="form-group">
                    <label for="service">Choose Service</label>
                    <select id="service" name="service" required>
                        <option value="">-- Select --</option>
                        <option value="Haircut & Shave">Haircut & Shave ($35)</option>
                        <option value="Beard Trim">Beard Trim ($20)</option>
                        <option value="Full Package">Full Package (Cut + Shave + Wash) ($50)</option>
                        <option value="Kids Cut">Kids Cut ($15)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="time">Preferred Time</label>
                    <input type="datetime-local" id="time" name="time" required>
                </div>

                <button type="submit">Book Now</button>
            </form>
        </div>

        <footer>
            <p>© 2025 Classic Cuts. All rights reserved.</p>
            <p><small>DevOps Project - Data stored in bookings.json</small></p>
        </footer>
    </div>
</body>
</html>
