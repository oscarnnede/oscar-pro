services:
  mongodb:
    image: mongo:8.0.4
    container_name: barber_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: pass
      MONGO_INITDB_DATABASE: barber_shop
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - barber_network

  mongo-express:
    image: mongo-express:1.0.2
    container_name: barber_admin
    restart: always
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_COMFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_BASICAUTH_ENABLED: "true"
    ports:
      - "8081:8081"
    networks:
      - barber_network

  barber-app:
    build: .
    image: barber-app:latest
    container_name: barber_app
    restart: always
    depends_on:
      - mongodb
    environment:
      MONGO_HOST: mongodb
      MONGO_USER: admin
      MONGO_PASS: pass
      MONGO_DB: barber_shop
    ports:
      - "5000:5000"
    networks:
      - barber_network

volumes:
  mongo_data:

networks:
  barber_network: