version: '3.8'

services:

  # 1. MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: barber_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: oscarn
      MONGO_INITDB_ROOT_PASSWORD: wizzy94
      MONGO_INITDB_DATABASE: barber_shop # Creates the DB on startup
    volumes:
      - mongo_data:/data/db # Persist data even if container restarts
    ports:
      - "27017:27017" # Optional: expose to host for debugging
    networks:
      - barber_network

  # 2. Mongo Express (Admin UI)
  mongo-express:
    image: mongo-express:latest
    container_name: barber_admin
    restart: always
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: oscarn
      ME_CONFIG_MONGODB_ADMINPASSWORD: wizzy94
      ME_CONFIG_MONGODB_SERVER: mongodb # Connects to the 'mongodb' service name
    ports:
      - "8081:8081" # Admin UI accessible on localhost:8081
    networks:
      - barber_network

  # 3. Your Flask App
  barber-app:
    build: . # Uses the Dockerfile in the current directory
    container_name: barber_app
    restart: always
    depends_on:
      - mongodb
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: oscarn
      MONGO_PASS: wizzy94
      MONGO_DB: barber_shop
    ports:
      - "5000:5000" # Flask app on localhost:5000
    networks:
      - barber_network

# Define persistent volume for MongoDB
volumes:
  mongo_data:

# Define network for internal communication
networks:
  barber_network: